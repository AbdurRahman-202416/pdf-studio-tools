services:
  - type: web
    name: pdf-tool-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: MAX_UPLOAD_MB
        value: 100
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: CORS_ORIGINS_RAW
        sync: false
      - key: SENTRY_DSN
        sync: false
